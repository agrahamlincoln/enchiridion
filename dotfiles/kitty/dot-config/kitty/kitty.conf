# requires aur ttf-fira-code
font_family 		Fira Code
bold_font		Fira Code Medium
italic_font 		Fira Code Light
bold_italic_font	Fira Code SemiBold
font_size 11.0

# --- Arch Linux Theme ---
# Colors: Curious Blue (#1793d1) and Mine Shaft (#333333)
background            #0a0a0a
foreground            #d6d3d1
cursor                #1793d1
selection_background  #444444
selection_foreground  #ffffff

# Black
color0                #292524
color8                #525252

# Red
color1                #f43f5e
color9                #fb7185

# Green
color2                #22c55e
color10               #4ade80

# Yellow
color3                #fcd34d
color11               #fde68a

# Blue
color4                #3b82f6
color12               #60a5fa

# Magenta
color5                #e879f9
color13               #f0abfc

# Cyan
color6                #06b6d4
color14               #22d3ee

# White
color7                #d4d4d8
color15               #e7e5e4

# Derive colors 16-255 from the palette above
palette_generate      semantic

# --- Chrome (Arch Blue is the only interactive accent) ---
url_color             #1793d1
active_border_color   #1793d1
inactive_border_color #333333
bell_border_color     #d97706

tab_bar_background    #0a0a0a
active_tab_foreground #0a0a0a
active_tab_background #1793d1
inactive_tab_foreground #d6d3d1
inactive_tab_background #333333

# --- Behavior ---
# Notify when a command running 30s+ finishes in an unfocused window
notify_on_cmd_finish  unfocused 30

# Reopen windows, tabs and scrollback after logout or reboot
restore_session_after_logout yes

include ${KITTY_OS}.conf
