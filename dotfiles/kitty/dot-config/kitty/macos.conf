# Overrides for kitty.conf specific to mac osx

# cuz, retina displays - maybe?
font_size 13.0

# for some reason alt-left and alt-right don't skip words by default
map alt+left send_text all \x1b\x62
map alt+right send_text all \x1b\x66

# hide titlebar but keep the native rounded window corners
hide_window_decorations titlebar-only

# keep text clear of the rounded corners
window_padding_width 8
placement_strategy center


# pick a file and insert its path at the prompt
map cmd+shift+o insert_chosen_file

# pick a session from ~/.config/kitty/sessions
map cmd+ctrl+s goto_session ~/.config/kitty/sessions
